name: Atualizar precos das ofertas

on:
  schedule:
    - cron: "17 * * * *" # a cada hora (horario UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-ofertas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx==0.27.2 beautifulsoup4==4.12.3

      - name: Atualizar offers.js
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_API_KEY: ${{ secrets.SHOPEE_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: python scripts/refresh_offers.py

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.js
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza precos das ofertas"
          git pull --rebase origin main
          git push
